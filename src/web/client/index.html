<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0914" />
  <meta name="description" content="Soluna — tu agente de programación con IA, extensible y privado." />
  <title>Soluna — AI Coding Agent</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='1' y2='0'%3E%3Cstop stop-color='%237dd3fc'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='28' fill='%23110e20'/%3E%3Cpath d='M64 23a30 30 0 1 0 13 49A25 25 0 0 1 64 23Z' fill='url(%23g)'/%3E%3Ccircle cx='68' cy='31' r='4' fill='%23f4f2ff'/%3E%3C/svg%3E" />
</head>
<body data-theme="dark">
  <div id="app">
    <!-- Sidebar: sessions, providers, status -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">☾</div>
          <span class="brand-name">Soluna</span>
        </div>
        <button class="icon-btn" id="sidebar-close" aria-label="Close sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Provider</div>
        <div class="provider-card" id="provider-card">
          <span class="provider-dot"></span>
          <span class="provider-name" id="provider-name">—</span>
          <span class="provider-model" id="provider-model"></span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Context</div>
        <div class="context-card">
          <div class="context-bar"><div class="context-fill" id="context-fill"></div></div>
          <div class="context-stats">
            <span id="context-used">0 tok</span>
            <span id="context-limit">—</span>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Usage</div>
        <div class="usage-grid">
          <div class="usage-cell">
            <div class="usage-value" id="usage-input">0</div>
            <div class="usage-label">input</div>
          </div>
          <div class="usage-cell">
            <div class="usage-value" id="usage-output">0</div>
            <div class="usage-label">output</div>
          </div>
          <div class="usage-cell">
            <div class="usage-value" id="usage-turns">0</div>
            <div class="usage-label">turns</div>
          </div>
          <div class="usage-cell">
            <div class="usage-value" id="usage-tools">0</div>
            <div class="usage-label">tools</div>
          </div>
        </div>
      </div>

      <div class="sidebar-section sidebar-section-grow">
        <div class="sidebar-label">Sessions</div>
        <div class="sessions-list" id="sessions-list"></div>
      </div>

      <div class="sidebar-footer">
        <button class="sidebar-btn" id="btn-new">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New
        </button>
        <button class="sidebar-btn" id="btn-save">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          Save
        </button>
        <button class="sidebar-btn" id="btn-theme">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title">New conversation</div>
        <div class="topbar-actions">
          <span class="status-pill" id="status-pill">
            <span class="status-dot"></span>
            <span id="status-text">ready</span>
          </span>
        </div>
      </header>

      <div class="transcript" id="transcript">
        <div class="empty-state" id="empty-state">
          <div class="empty-mark" aria-hidden="true">☾</div>
          <h2>What can I help with?</h2>
          <p>Ask me to read, edit, or run anything in your workspace.</p>
          <div class="suggestions">
            <button class="suggestion" data-msg="What files are in this repository?">What files are in this repository?</button>
            <button class="suggestion" data-msg="Explain the main entry point">Explain the main entry point</button>
            <button class="suggestion" data-msg="Add error handling to the API routes">Add error handling to the API routes</button>
          </div>
        </div>
      </div>

      <div class="live-region" id="live-region">
        <div class="compacting-banner" id="compacting-banner">
          <div class="spinner"></div>
          <span id="compacting-text">Compacting…</span>
        </div>
        <div class="stream-output" id="stream-output"></div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <div class="composer-input-wrap">
            <textarea id="composer-input" rows="1" placeholder="Message Soluna…" autocomplete="off" spellcheck="false"></textarea>
          </div>
          <button class="composer-send" id="composer-send" aria-label="Send">
            <svg id="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 11l5-5 5 5M12 6v12"/></svg>
            <div id="stop-icon" class="spinner" style="display:none"></div>
          </button>
        </div>
        <div class="composer-hint">
          <span id="model-hint">zen</span>
          <span class="hint-dot">·</span>
          <span>Shift+Enter for newline</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Ask modal -->
  <div class="overlay" id="ask-overlay">
    <div class="modal" id="ask-modal">
      <h3 id="ask-title"></h3>
      <div id="ask-body"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="ask-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
